services:
  # Backend Flask
  - type: web
    name: contract-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: python main.py
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PORT
        value: 5328
      - key: CHROMA_DB_DIR
        value: /tmp/chroma_db
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: GRAPH_DIR
        value: /tmp/graphs

  # Frontend Next.js
  - type: web
    name: contract-frontend
    runtime: node
    rootDir: document-q-and-a-ui
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: BACKEND_API_URL
        fromService:
          name: contract-backend
          type: web
          property: host